name: Preparar produção

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-coaph-production-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Compilar aplicação
        run: |
          npm ci
          npm run build

      - name: Montar branch de produção
        run: |
          mkdir -p publish/api
          cp -R dist/. publish/
          cp .htaccess publish/.htaccess
          rsync -a --exclude='config.php' api/ publish/api/

      - name: Atualizar branch production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd publish
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b production
          git add .
          git commit -m "Build de produção ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin production
